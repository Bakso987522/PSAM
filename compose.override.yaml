services:
  db:
    ports:
      - "${DB_PORT:-5432}:5432"

  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app
    ports:
      - "${API_PORT:-8000}:8000"

  frontend:
    command: npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  importer:
    volumes:
      - ./importer:/app
